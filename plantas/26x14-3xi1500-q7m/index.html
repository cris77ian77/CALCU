.titulo { display: flex; flex-direction: column; min-width: 0; }
.titulo b { font-size: 16px; }
.titulo span { font-size: 12px; color: var(--muted); }
.stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#scene { display: block; width: 100%; height: 100%; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.et { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 7px; background: rgba(7, 20, 38, 0.82); border: 1px solid var(--line); }
.et.cota { background: #ffd166; color: #2b2100; border: 0; font-size: 11.5px; }
.barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: rgba(7, 20, 38, 0.9); }
.vistas { display: flex; flex-wrap: wrap; gap: 6px; }
.barra button, .barra a { font: inherit; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 8px 13px; border: 1px solid var(--line); background: rgba(31, 94, 168, 0.25); color: #fff; cursor: pointer; text-decoration: none; }
.barra button:hover { background: var(--blue); }
.barra .wa { margin-left: auto; background: #25d366; border-color: #25d366; color: #06270f; font-weight: 700; }
.loader { position: absolute; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, #12335a, var(--navy-900)); transition: opacity .6s; }
.loader.done { opacity: 0; pointer-events: none; }
.loader-box { text-align: center; }
.loader-brand { font-weight: 800; font-size: 30px; }
.loader-msg { font-size: 12px; color: var(--muted); margin-top: 10px; }

</style>
