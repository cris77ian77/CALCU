.titulo { display: flex; flex-direction: column; }
.titulo small { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--blue-500); font-weight: 800; }
.titulo b { font-size: 20px; font-weight: 900; letter-spacing: .02em; }
.stage { position: relative; grid-column: 1; grid-row: 1 / 4; min-height: 0; }
#scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; cursor: grab; }
/* Nombre grande de la elegida, sobre la escena */
.hero { position: absolute; left: 24px; top: 84px; z-index: 2; pointer-events: none; }
.hero .num { font-size: 13px; font-weight: 800; color: var(--blue-500); letter-spacing: .2em; }
.hero h1 { margin: 2px 0 0; font-size: clamp(30px, 5vw, 58px); font-weight: 900; line-height: 1; letter-spacing: -.01em; text-shadow: 0 6px 30px rgba(0, 0, 0, .5); }
.hero h1 em { font-style: normal; color: var(--ice); }
.hero .kg { margin-top: 8px; display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(47, 143, 255, .16); border: 1px solid rgba(47, 143, 255, .45); font-weight: 800; }
.hero .kg span { font-size: 12px; color: var(--muted); font-weight: 600; }
.hero.cambio h1, .hero.cambio .kg { animation: entra .45s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: none; } }
/* Flechas */
.flecha { position: absolute; top: 50%; z-index: 2; width: 52px; height: 52px; margin-top: -26px; border-radius: 50%; border: 1px solid var(--line); background: rgba(10, 26, 48, .7); backdrop-filter: blur(6px); font-size: 26px; cursor: pointer; display: grid; place-items: center; transition: background .2s, transform .2s; }
.flecha:hover { background: var(--blue); transform: scale(1.08); }
.flecha:disabled { opacity: .25; pointer-events: none; }
.flecha.izq { left: 16px; } .flecha.der { right: 16px; }
/* Tarjetas de abajo */
.cards { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 2; display: flex; gap: 10px; }
.card { width: 132px; padding: 10px 12px 11px; border-radius: 14px; border: 1px solid var(--line); background: rgba(10, 26, 48, .78); backdrop-filter: blur(6px); cursor: pointer; text-align: left; transition: transform .25s, border-color .25s, background .25s; }
.card b { display: block; font-size: 15px; font-weight: 900; }
.card span { font-size: 11px; color: var(--muted); }
.card i { display: block; height: 4px; margin-top: 8px; border-radius: 2px; background: rgba(143, 200, 255, .16); overflow: hidden; }
.card i::after { content: ""; display: block; height: 100%; width: var(--p); background: var(--muted); }
.card.on { transform: translateY(-8px); border-color: var(--blue-500); background: linear-gradient(160deg, rgba(31, 94, 168, .9), rgba(10, 26, 48, .9)); box-shadow: 0 10px 30px rgba(47, 143, 255, .35); }
.card.on i::after { background: var(--ice); }
.ayuda { position: absolute; left: 50%; bottom: calc(118px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 2; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
/* Ficha al costado */
.ficha { grid-column: 2; grid-row: 2 / 4; position: relative; z-index: 2; overflow-y: auto; padding: 8px 22px calc(22px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(10, 26, 48, .92), rgba(5, 15, 30, .98)); border-left: 1px solid var(--line); }
.ficha h2 { margin: 6px 0 2px; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--blue-500); font-weight: 800; }
.ficha .sub { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 4px 0 16px; }
.stat { margin-bottom: 13px; }
.stat-t { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 6px; }
.stat-t span { color: var(--muted); }
.stat-t b { font-weight: 800; }
.barra { height: 8px; border-radius: 4px; background: rgba(143, 200, 255, .12); overflow: hidden; }
.barra div { height: 100%; width: 0; border-radius: 4px; background: linear-gradient(90deg, var(--blue-500), var(--ice)); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
dl { margin: 18px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 9px 14px; font-size: 12.5px; }
dt { color: var(--muted); }
dd { margin: 0; font-weight: 700; text-align: right; }
.entrar { margin-top: 22px; width: 100%; padding: 15px 18px; border: 0; border-radius: 14px; background: linear-gradient(135deg, var(--gold), #ffb627); color: #2b2100; font-weight: 900; font-size: 15px; letter-spacing: .02em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 30px rgba(255, 182, 39, .3); transition: transform .2s; }
.entrar:hover { transform: translateY(-2px); }
.entrar small { display: block; font-size: 11px; font-weight: 700; opacity: .75; }
.wa { margin-top: 10px; width: 100%; padding: 12px; border-radius: 14px; border: 1px solid rgba(37, 211, 102, .5); background: rgba(37, 211, 102, .12); color: #c9f7dc; font-weight: 700; cursor: pointer; text-decoration: none; display: block; text-align: center; font-size: 13.5px; }
.nota { font-size: 11px; color: var(--muted); margin-top: 14px; line-height: 1.45; }
.cargando { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 1; font-size: 13px; color: var(--muted); pointer-events: none; transition: opacity .4s; }
.cargando.fuera { opacity: 0; }
/* Celular: la escena arriba y la ficha abajo, deslizable */
@media (max-width: 860px) {
  #app { grid-template-columns: 1fr; grid-template-rows: auto 52vh 1fr; }
  .stage { grid-row: 1 / 3; }
  .ficha { grid-column: 1; grid-row: 3; border-left: 0; border-top: 1px solid var(--line); padding: 4px 16px calc(18px + env(safe-area-inset-bottom)); }
  .hero { left: 16px; top: 64px; }
  .cards { bottom: 10px; gap: 6px; width: calc(100% - 24px); justify-content: center; }
  .card { width: auto; flex: 1; padding: 8px 8px 9px; }
  .card b { font-size: 13px; } .card span { font-size: 10px; }
  .ayuda { display: none; }
  .flecha { width: 40px; height: 40px; margin-top: -20px; font-size: 20px; }
  .flecha.izq { left: 8px; } .flecha.der { right: 8px; }
  .top { padding: 10px 16px; } .titulo b { font-size: 16px; } .titulo small { display: none; }
  .logo { width: 104px; height: 28px; }
}
</style>
</head>

<div id="app">
  <header class="top">
    <div class="logo" role="img" aria-label="Polair"></div>
    <div class="titulo"><small>Fábrica Virtual · Línea Roll Ice</small><b>Elegí tu máquina</b></div>
  </header>
  <div class="stage">
    <canvas id="scene" aria-label="Las cuatro Roll Ice en fila"></canvas>
    <div class="cargando" id="cargando">Cargando las máquinas…</div>
    <div class="hero" id="hero"></div>
    <button class="flecha izq" id="ant" type="button" aria-label="Máquina anterior">‹</button>
    <button class="flecha der" id="sig" type="button" aria-label="Máquina siguiente">›</button>
    <div class="ayuda">← → para cambiar · Enter para entrar · tocá la máquina del centro</div>
    <nav class="cards" id="cards" aria-label="Modelos"></nav>
  </div>
  <aside class="ficha" id="ficha" aria-live="polite"></aside>
