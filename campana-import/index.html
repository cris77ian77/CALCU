const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

function log(t) { document.getElementById('log').textContent += t + '\n'; }

onAuthStateChanged(auth, async user => {
  if (user) {
    const snap = await getDoc(doc(db, 'usuarios', user.uid));
    if (snap.exists() && snap.data().rol === 'admin') {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('import-section').style.display = 'block';
      document.getElementById('user-info').textContent = '✓ Autenticado como ' + user.email;
    }
  }
});

window.doLogin = async () => {
  try {
    await signInWithEmailAndPassword(auth,
      document.getElementById('email').value,
      document.getElementById('pass').value);
  } catch(e) { log('❌ ' + e.message); }
};

window.doImport = async () => {
  const btn = document.getElementById('imp-btn');
  btn.disabled = true; btn.textContent = 'Importando…';
  try {
    const BATCH = 499;
    let total = 0;
    for (let i = 0; i < LEADS.length; i += BATCH) {
      const batch = writeBatch(db);
      LEADS.slice(i, i + BATCH).forEach(r => {
        batch.set(doc(collection(db, 'campana_leads')), { ...r, importadoEn: serverTimestamp() });
      });
      await batch.commit();
      total += Math.min(BATCH, LEADS.length - i);
      log('✓ ' + total + '/' + LEADS.length + ' importados…');
    }
    log('\n✅ ¡Listo! ' + total + ' leads en Firestore.');
    btn.textContent = '✅ Importación completa';
  } catch(e) {
    log('❌ Error: ' + e.message);
    btn.disabled = false; btn.textContent = '✓ Importar 632 leads a Firestore';
  }
};
</script>
