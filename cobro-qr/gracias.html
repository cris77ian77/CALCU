<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gracias · Portal de Hielo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    color: #1e293b;
    text-align: center;
  }
  #tarjeta {
    background: #fff;
    border-radius: 1rem;
    box-shadow: 0 4px 24px rgba(0,0,0,.10);
    width: 100%;
    max-width: 420px;
    padding: 2.5rem 2rem;
  }
  .icono {
    width: 4rem; height: 4rem;
    border-radius: 50%;
    background: #dcfce7;
    color: #15803d;
    font-size: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.2rem;
  }
  h1 { font-size: 1.3rem; margin-bottom: .5rem; }
  p { color: #64748b; font-size: .9rem; }
</style>
</head>
<body>
  <div id="tarjeta">
    <div class="icono">✔</div>
    <h1>¡Gracias!</h1>
    <p>Tu pago fue procesado. Podés cerrar esta página; el comercio ya ve la confirmación en su pantalla.</p>
  </div>
</body>
</html>
