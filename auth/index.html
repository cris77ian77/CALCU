<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso · Portal de Hielo</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1e293b;
    }

    /* ── Widget contenedor ────────────────────────────────────── */
    #auth-widget {
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    /* ── Cabecera ─────────────────────────────────────────────── */
    .auth-header {
      background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
      padding: 2rem 2rem 1.5rem;
      text-align: center;
      color: #fff;
    }
    .auth-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -.5px;
    }
    .auth-header p {
      font-size: .875rem;
      opacity: .85;
      margin-top: .25rem;
    }

    /* ── Tabs ─────────────────────────────────────────────────── */
    .auth-tabs {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
    }
    .tab-btn {
      flex: 1;
      padding: .9rem;
      border: none;
      background: #f8fafc;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 600;
      color: #64748b;
      transition: color .2s, background .2s;
    }
    .tab-btn.active {
      background: #fff;
      color: #0369a1;
      border-bottom: 2px solid #0369a1;
      margin-bottom: -2px;
    }
    .tab-btn:hover:not(.active) { color: #334155; }

    /* ── Cuerpo del formulario ────────────────────────────────── */
    .auth-body { padding: 1.75rem 2rem 2rem; }

    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Grupos y filas ───────────────────────────────────────── */
    .form-row {
      display: grid;
      gap: .75rem;
      margin-bottom: .75rem;
    }
    .form-row.cols-2 { grid-template-columns: 1fr 1fr; }

    .form-group { display: flex; flex-direction: column; gap: .35rem; }
    .form-group label {
      font-size: .78rem;
      font-weight: 600;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .form-group label .opt {
      font-weight: 400;
      color: #94a3b8;
      text-transform: none;
      letter-spacing: 0;
      font-size: .75rem;
    }

    /* ── Inputs ───────────────────────────────────────────────── */
    input, select {
      width: 100%;
      padding: .65rem .85rem;
      border: 1.5px solid #cbd5e1;
      border-radius: .5rem;
      font-size: .9rem;
      color: #1e293b;
      background: #fff;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      appearance: none;
    }
    input:focus, select:focus {
      border-color: #0ea5e9;
      box-shadow: 0 0 0 3px rgba(14,165,233,.15);
    }
    input.error, select.error {
      border-color: #ef4444;
      box-shadow: 0 0 0 3px rgba(239,68,68,.12);
    }
    .field-error {
      font-size: .75rem;
      color: #dc2626;
      margin-top: .15rem;
    }
    .field-hint {
      font-size: .72rem;
      color: #64748b;
      margin-top: .15rem;
      line-height: 1.35;
    }
    .login-hint {
      font-size: .85rem;
      color: #475569;
      margin-bottom: 1rem;
      line-height: 1.4;
    }
    input[readonly] {
      background: #f8fafc;
      color: #64748b;
      cursor: not-allowed;
    }

    /* ── Selector de perfil (tarjetas) ───────────────────────── */
    .perfil-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .6rem;
      margin-bottom: .75rem;
    }
    .perfil-card {
      position: relative;
      cursor: pointer;
    }
    .perfil-card input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0; height: 0;
    }
    .perfil-card span {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      padding: .75rem .5rem;
      border: 1.5px solid #cbd5e1;
      border-radius: .6rem;
      text-align: center;
      font-size: .72rem;
      font-weight: 600;
      color: #64748b;
      line-height: 1.3;
      transition: all .18s;
      background: #f8fafc;
      cursor: pointer;
    }
    .perfil-card span .icon { font-size: 1.4rem; }
    .perfil-card input:checked + span {
      border-color: #0ea5e9;
      background: #eff8ff;
      color: #0369a1;
      box-shadow: 0 0 0 3px rgba(14,165,233,.15);
    }
    .perfil-card span:hover { border-color: #93c5fd; background: #f0f9ff; }

    /* ── Password wrapper (ojo) ───────────────────────────────── */
    .input-wrap { position: relative; }
    .input-wrap input { padding-right: 2.6rem; }
    .toggle-pw {
      position: absolute;
      right: .7rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      font-size: 1rem;
      padding: 0;
      line-height: 1;
    }
    .toggle-pw:hover { color: #475569; }

    /* ── Botón principal ──────────────────────────────────────── */
    .btn-primary {
      width: 100%;
      padding: .85rem;
      background: linear-gradient(135deg, #0ea5e9, #0369a1);
      color: #fff;
      border: none;
      border-radius: .6rem;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1rem;
      transition: opacity .2s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }
    .btn-primary:hover:not(:disabled) { opacity: .9; }
    .btn-primary:active:not(:disabled) { transform: scale(.98); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    /* ── Botón secundario / link ──────────────────────────────── */
    .btn-link {
      background: none;
      border: none;
      color: #0369a1;
      cursor: pointer;
      font-size: .84rem;
      font-weight: 600;
      padding: 0;
      text-decoration: underline;
    }
    .btn-link:hover { color: #0ea5e9; }

    /* ── Alertas ──────────────────────────────────────────────── */
    .alert {
      padding: .75rem 1rem;
      border-radius: .5rem;
      font-size: .85rem;
      margin-bottom: .9rem;
      display: none;
    }
    .alert.show { display: flex; align-items: flex-start; gap: .5rem; }
    .alert-error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .alert-info    { background: #eff8ff; color: #1e40af; border: 1px solid #bfdbfe; }

    /* ── Olvidé mi contraseña ─────────────────────────────────── */
    .forgot-wrap {
      text-align: right;
      margin-top: .35rem;
      margin-bottom: .25rem;
    }

    /* ── Panel "sesión iniciada" ──────────────────────────────── */
    #panel-sesion .user-card {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: .75rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .user-avatar {
      width: 3rem; height: 3rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #0ea5e9, #0369a1);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: .75rem;
    }
    .user-name { font-size: 1.1rem; font-weight: 700; color: #1e293b; }
    .user-email { font-size: .82rem; color: #64748b; margin-bottom: .75rem; }
    .user-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .4rem;
    }
    .user-meta-item { font-size: .8rem; color: #475569; }
    .user-meta-item strong { display: block; color: #1e293b; font-size: .85rem; }

    .badge-perfil {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      background: #eff8ff;
      color: #0369a1;
      border: 1px solid #bae6fd;
      border-radius: 2rem;
      padding: .2rem .7rem;
      font-size: .78rem;
      font-weight: 700;
      margin-top: .6rem;
    }

    .btn-logout {
      width: 100%;
      padding: .75rem;
      background: #fff;
      color: #dc2626;
      border: 1.5px solid #fca5a5;
      border-radius: .6rem;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, color .2s;
    }
    .btn-logout:hover { background: #fef2f2; }

    /* ── Spinner ──────────────────────────────────────────────── */
    .spinner {
      width: 1rem; height: 1rem;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ───────────────────────────────────────────────── */
    .auth-footer {
      text-align: center;
      padding: 1rem;
      font-size: .78rem;
      color: #94a3b8;
      border-top: 1px solid #f1f5f9;
    }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 420px) {
      .auth-body { padding: 1.25rem 1.25rem 1.5rem; }
      .form-row.cols-2 { grid-template-columns: 1fr; }
      .perfil-group { grid-template-columns: 1fr; }
      .perfil-card span { flex-direction: row; justify-content: flex-start; padding: .6rem .85rem; }
    }

    /* ── Ingreso simplificado ─────────────────────────────────── */
    .brand-logo { height: 38px; margin-bottom: .55rem; background:#fff; border-radius:8px; padding:4px 8px; }
    .btn-google { width:100%; display:flex; align-items:center; justify-content:center; gap:.6rem; padding:.78rem 1rem;
      background:#fff; color:#1f2937; border:1.5px solid #d1d5db; border-radius:.6rem; font-size:.95rem; font-weight:700; cursor:pointer; }
    .btn-google:hover { background:#f8fafc; border-color:#9ca3af; }
    .btn-google:disabled { opacity:.6; cursor:not-allowed; }
    .divider { display:flex; align-items:center; gap:.75rem; color:#94a3b8; font-size:.8rem; margin:1.1rem 0; }
    .divider::before, .divider::after { content:''; flex:1; height:1px; background:#e2e8f0; }
    #extra { display:none; margin:.4rem 0 1rem; padding-top:1rem; border-top:1px dashed #cbd5e1; }
    #extra.show { display:block; }
    #extra h3 { font-size:1rem; color:#0d3b66; margin-bottom:.8rem; }
    input[readonly] { background:#f1f5f9; color:#64748b; }
    .old-access { margin-top:1rem; text-align:center; }
  </style>
</head>
<body>

<div id="auth-widget">

  <div class="auth-header">
    <img class="brand-logo" src="../assets/polair-logo.png" alt="Polair">
    <h1>Calculadora de Fábrica de Hielo</h1>
    <p>Ingresá para ver tu proyección</p>
  </div>

  <div class="auth-body">
    <div id="panel-login" class="panel active">

      <div class="alert alert-error" id="login-error"></div>
      <div class="alert alert-success" id="login-success"></div>

      <div id="google-wrap">
        <button type="button" class="btn-google" id="btn-google">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Continuar con Google
        </button>
        <div class="divider">o</div>
      </div>

      <form id="form-login" novalidate>
        <div class="form-row" id="row-email">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" autocomplete="email" />
            <span class="field-error" id="err-login-email"></span>
          </div>
        </div>
        <div class="form-row" id="row-telefono">
          <div class="form-group">
            <label for="login-telefono">Celular</label>
            <input type="tel" id="login-telefono" autocomplete="tel" inputmode="tel" />
            <span class="field-hint">Con código de área, sin el 0 ni el 15. La próxima vez entrás con estos mismos datos.</span>
            <span class="field-error" id="err-login-telefono"></span>
          </div>
        </div>

        <!-- Solo para cuentas nuevas o incompletas: aparece en la misma tarjeta -->
        <div id="extra">
          <h3>¡Bienvenido! Solo dos datos más</h3>
          <div class="form-row">
            <div class="form-group">
              <label for="extra-nombre">Nombre y apellido</label>
              <input type="text" id="extra-nombre" autocomplete="name" />
              <span class="field-error" id="err-extra-nombre"></span>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:.6rem;"><label>¿Para qué es el hielo?</label></div>
          <div class="perfil-group">
            <label class="perfil-card"><input type="radio" name="perfil" value="consumo_propio" /><span><span class="icon">🏠</span>Consumo propio</span></label>
            <label class="perfil-card"><input type="radio" name="perfil" value="venta_negocio" /><span><span class="icon">🏪</span>Venta en negocio</span></label>
            <label class="perfil-card"><input type="radio" name="perfil" value="distribucion_hielo" /><span><span class="icon">🚚</span>Distribución de hielo</span></label>
          </div>
          <span class="field-error" id="err-perfil" style="display:block;margin-bottom:.6rem;"></span>
        </div>

        <button type="submit" class="btn-primary" id="btn-login">Entrar</button>
      </form>

      <div class="old-access" id="old-access">
        <button type="button" class="btn-link" id="btn-show-old-pw">¿Entraste antes con contraseña?</button>
      </div>
      <div id="old-password-section" style="display:none; margin-top:.85rem;">
        <div class="form-group" style="margin-bottom:.65rem;">
          <label for="old-password">Contraseña anterior</label>
          <div class="input-wrap">
            <input type="password" id="old-password" autocomplete="current-password" />
            <button type="button" class="toggle-pw" data-target="old-password" aria-label="Mostrar contraseña">👁</button>
          </div>
        </div>
        <button type="button" class="btn-primary" id="btn-old-login">Entrar con contraseña</button>
        <button type="button" class="btn-link" id="btn-forgot" style="display:block;margin-top:.6rem">Recuperar acceso por email</button>
      </div>

    </div>
  </div>

  <div class="auth-footer">
    Tus datos están protegidos · <a href="#" style="color:#94a3b8">Privacidad</a>
  </div>
</div>

<script type="module">
  import {
    validarTelefono, normalizarTelefono, provinciaDesdeCelular,
    login, recuperarPassword, obtenerDatosUsuario,
    completarPerfil, marcarOrigen, onAuthChange,
    loginConTelefono, registrarConTelefono, migrarPasswordATelefono,
    loginConGoogle, errorDeRedireccion
  } from './auth.js';

  // ── UTM ───────────────────────────────────────────────────────
  const UTM_KEYS = ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'];
  const params   = new URLSearchParams(window.location.search);
  const utmDesdeUrl = {};
  UTM_KEYS.forEach(k => { const v = params.get(k); if (v) utmDesdeUrl[k] = v; });
  if (Object.keys(utmDesdeUrl).length) sessionStorage.setItem('calcu_utm', JSON.stringify(utmDesdeUrl));
  const utm = JSON.parse(sessionStorage.getItem('calcu_utm') || '{}');

  // ── A dónde volver después del ingreso ────────────────────────
  const DESTINOS = { vending: '../vending/' };
  const volver   = DESTINOS[params.get('volver')] ? params.get('volver') : null;
  const DESTINO  = volver ? DESTINOS[volver] : '../index.html';

  // ── Aviso por email al admin de cada usuario nuevo ────────────
  async function notificarAdmin({ nombre, apellido, email, telefono, provincia, perfil }) {
    const perfLabels = { consumo_propio:'Consumo propio', venta_negocio:'Venta en negocio', distribucion_hielo:'Distribución de hielo' };
    try {
      await fetch('https://api.emailjs.com/api/v1.0/email/send', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          service_id: 'service_ddo7iqs', template_id: 'template_35q95xh', user_id: 'fYaCaTEQ7ctLYdo6e',
          template_params: {
            to_email: 'cristian@polair.com.ar', nombre, apellido, email,
            telefono: telefono || '—', provincia: provincia || '—', perfil: perfLabels[perfil] || perfil || '—',
            utm_source: utm.utm_source || 'Directo', utm_medium: utm.utm_medium || '—', utm_campaign: utm.utm_campaign || '—',
            fecha: new Date().toLocaleString('es-AR'),
          },
        }),
      });
    } catch (e) { console.warn('[EMAIL] Error al enviar:', e); }
  }

  // ── Utilidades DOM ────────────────────────────────────────────
  const $  = (sel) => document.querySelector(sel);
  const $$ = (sel) => document.querySelectorAll(sel);
  function showAlert(id, msg, tipo = 'error') {
    const el = $(id); el.className = `alert alert-${tipo} show`;
    el.innerHTML = (tipo === 'error' ? '⚠️ ' : tipo === 'success' ? '✅ ' : 'ℹ️ ') + msg;
  }
  function hideAlert(id) { const el = $(id); el.className = 'alert'; el.textContent = ''; }
  function fieldError(id, inputId, msg) {
    const el = $(id); if (el) { el.textContent = msg; el.style.display = msg ? 'block' : 'none'; }
    if (inputId) $(inputId).classList.toggle('error', !!msg);
  }
  function clearErrors() {
    $$('.error').forEach(el => el.classList.remove('error'));
    $$('.field-error').forEach(el => { el.textContent = ''; el.style.display = 'none'; });
    hideAlert('#login-error'); hideAlert('#login-success');
  }
  function setLoading(btn, loading, texto) {
    if (loading) { btn.disabled = true; btn.dataset.orig = btn.innerHTML; btn.innerHTML = '<span class="spinner"></span> Procesando…'; }
    else { btn.disabled = false; btn.innerHTML = texto || btn.dataset.orig || btn.innerHTML; }
  }
  $$('.toggle-pw').forEach(btn => btn.addEventListener('click', () => {
    const input = $(`#${btn.dataset.target}`);
    input.type = input.type === 'password' ? 'text' : 'password';
    btn.textContent = input.type === 'password' ? '👁' : '🙈';
  }));

  const erroresFirebase = {
    'auth/invalid-email'          : 'El email no es válido.',
    'auth/too-many-requests'      : 'Demasiados intentos. Probá de nuevo en unos minutos.',
    'auth/network-request-failed' : 'Error de conexión. Verificá tu internet.',
    'auth/wrong-password'         : 'La contraseña es incorrecta.',
    'auth/invalid-credential'     : 'Los datos no coinciden.',
    'auth/user-not-found'         : 'No existe una cuenta con ese email.',
    'auth/account-exists-with-different-credential': 'Ese email ya tiene cuenta: entrá con tu email y tu celular.',
    'auth/operation-not-allowed'  : 'El ingreso con Google todavía no está habilitado. Entrá con tu email y tu celular.',
    'auth/configuration-not-found': 'El ingreso con Google todavía no está habilitado. Entrá con tu email y tu celular.',
    'auth/unauthorized-domain'    : 'El ingreso con Google no está habilitado para este sitio. Entrá con tu email y tu celular.',
  };
  const tradError = (err) => erroresFirebase[err.code] || err.message || 'Error inesperado.';

  // ── Estado ────────────────────────────────────────────────────
  let enCurso = false;        // hay un ingreso/registro en marcha: el observador no redirige
  let usuario = null;         // usuario autenticado que tiene que completar datos
  let datosPrevios = null;    // documento de Firestore (si existe)
  let celularIngresado = '';  // celular tipeado en el primer paso

  // Muestra los dos datos extra en la misma tarjeta
  function mostrarExtra(user, doc) {
    usuario = user; datosPrevios = doc;
    $('#google-wrap').style.display = 'none';
    $('#old-access').style.display = 'none';
    $('#old-password-section').style.display = 'none';
    const email = $('#login-email'); email.value = user.email || ''; email.readOnly = true;
    const tel = $('#login-telefono');
    const telConocido = celularIngresado || doc?.telefono || '';
    if (telConocido) { tel.value = telConocido; tel.readOnly = true; }
    else { tel.readOnly = false; $('#row-telefono .field-hint').textContent = 'Con código de área, sin el 0 ni el 15. Lo usamos para contactarte por WhatsApp.'; }
    const nombreDoc = [doc?.nombre, doc?.apellido].filter(Boolean).join(' ');
    $('#extra-nombre').value = nombreDoc || user.displayName || '';
    if (doc?.perfil) { const r = document.querySelector(`input[name="perfil"][value="${doc.perfil}"]`); if (r) r.checked = true; }
    $('#extra').classList.add('show');
    $('#btn-login').innerHTML = 'Ver la calculadora →';
    (!$('#extra-nombre').value ? $('#extra-nombre') : (tel.readOnly ? $('#extra-nombre') : tel)).focus();
  }

  const perfilCompleto = (doc) => !!(doc && doc.nombre && doc.perfil);

  // ── Envío del formulario: entrar / crear cuenta / completar ───
  $('#form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErrors();
    const btn = $('#btn-login');

    // Paso de completar datos (cuenta nueva o incompleta)
    if (usuario) {
      const nombreCompleto = $('#extra-nombre').value.trim().replace(/\s+/g, ' ');
      const perfil = document.querySelector('input[name="perfil"]:checked')?.value;
      const telefono = $('#login-telefono').value.trim();
      let ok = true;
      if (!telefono) { fieldError('#err-login-telefono', '#login-telefono', 'Ingresá tu celular.'); ok = false; }
      else if (!validarTelefono(telefono)) { fieldError('#err-login-telefono', '#login-telefono', 'El celular debe tener al menos 10 dígitos, con código de área.'); ok = false; }
      if (nombreCompleto.length < 2) { fieldError('#err-extra-nombre', '#extra-nombre', 'Ingresá tu nombre y apellido.'); ok = false; }
      if (!perfil) { fieldError('#err-perfil', null, 'Elegí para qué es el hielo.'); ok = false; }
      if (!ok) return;

      const [nombre, ...resto] = nombreCompleto.split(' ');
      const apellido = resto.join(' ');
      const provincia = datosPrevios?.provincia || provinciaDesdeCelular(telefono) || null;
      setLoading(btn, true);
      enCurso = true;
      try {
        await completarPerfil(usuario.uid, usuario.email, {
          nombre, apellido, telefono: datosPrevios?.telefono || telefono, provincia, perfil, utm,
          metodoIngreso: usuario.providerData?.some(p => p.providerId === 'google.com') ? 'google' : 'email_celular',
        });
        if (!perfilCompleto(datosPrevios)) await notificarAdmin({ nombre, apellido, email: usuario.email, telefono, provincia, perfil });
        if (volver) await marcarOrigen(usuario.uid, volver);
        window.location.replace(DESTINO);
      } catch (err) {
        enCurso = false;
        showAlert('#login-error', tradError(err), 'error');
        setLoading(btn, false);
      }
      return;
    }

    // Primer paso: email + celular
    const email = $('#login-email').value.trim();
    const telefono = $('#login-telefono').value.trim();
    let ok = true;
    if (!email) { fieldError('#err-login-email', '#login-email', 'Ingresá tu email.'); ok = false; }
    if (!telefono) { fieldError('#err-login-telefono', '#login-telefono', 'Ingresá tu celular.'); ok = false; }
    else if (!validarTelefono(telefono)) { fieldError('#err-login-telefono', '#login-telefono', 'El celular debe tener al menos 10 dígitos, con código de área.'); ok = false; }
    if (!ok) return;

    setLoading(btn, true);
    enCurso = true;
    celularIngresado = telefono;
    try {
      const cred = await loginConTelefono(email, telefono);
      const doc = await obtenerDatosUsuario(cred.user.uid).catch(() => null);
      if (perfilCompleto(doc)) { window.location.replace(DESTINO); return; }
      setLoading(btn, false); mostrarExtra(cred.user, doc);
    } catch (loginErr) {
      const credCodes = ['auth/user-not-found','auth/wrong-password','auth/invalid-credential','auth/invalid-login-credentials'];
      if (!credCodes.includes(loginErr.code)) {
        enCurso = false; showAlert('#login-error', tradError(loginErr), 'error'); setLoading(btn, false); return;
      }
      try {
        const user = await registrarConTelefono(email, telefono);
        setLoading(btn, false); mostrarExtra(user, null);
      } catch (regErr) {
        enCurso = false; celularIngresado = '';
        if (regErr.code === 'auth/email-already-in-use') {
          showAlert('#login-error', 'Ese email ya tiene una cuenta con otro celular. Revisá el número; si antes entraste con Google, usá el botón de Google.', 'error');
        } else {
          showAlert('#login-error', tradError(regErr), 'error');
        }
        setLoading(btn, false);
      }
    }
  });

  // ── Continuar con Google ──────────────────────────────────────
  $('#btn-google').addEventListener('click', async () => {
    clearErrors();
    const btn = $('#btn-google');
    btn.disabled = true; enCurso = true;
    try {
      const user = await loginConGoogle();
      if (!user) return; // redirección en curso
      const doc = await obtenerDatosUsuario(user.uid).catch(() => null);
      if (perfilCompleto(doc) && doc.telefono) { window.location.replace(DESTINO); return; }
      mostrarExtra(user, doc);
    } catch (err) {
      enCurso = false;
      if (err.code !== 'auth/popup-closed-by-user' && err.code !== 'auth/cancelled-popup-request') showAlert('#login-error', tradError(err), 'error');
    } finally { btn.disabled = false; }
  });

  // ── Acceso con contraseña vieja ───────────────────────────────
  $('#btn-show-old-pw').addEventListener('click', () => {
    const sec = $('#old-password-section');
    sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
    if (sec.style.display === 'block') $('#old-password').focus();
  });
  $('#btn-old-login').addEventListener('click', async () => {
    clearErrors();
    const email = $('#login-email').value.trim();
    const telefono = $('#login-telefono').value.trim();
    const oldPw = $('#old-password').value;
    if (!email) { showAlert('#login-error', 'Ingresá tu email arriba.', 'error'); return; }
    if (!oldPw) { showAlert('#login-error', 'Ingresá tu contraseña anterior.', 'error'); return; }
    const btn = $('#btn-old-login');
    setLoading(btn, true); enCurso = true;
    try {
      const user = await login(email, oldPw);
      if (telefono && validarTelefono(telefono) &&
          window.confirm('¿Querés que la próxima vez puedas entrar solo con tu email y celular?')) {
        try { await migrarPasswordATelefono(telefono); } catch (_) { /* la contraseña vieja sigue funcionando */ }
      }
      const doc = await obtenerDatosUsuario(user.uid).catch(() => null);
      if (perfilCompleto(doc)) { window.location.replace(DESTINO); return; }
      setLoading(btn, false); mostrarExtra(user, doc);
    } catch (err) {
      enCurso = false; showAlert('#login-error', tradError(err), 'error'); setLoading(btn, false);
    }
  });
  $('#btn-forgot').addEventListener('click', async () => {
    const email = $('#login-email').value.trim();
    if (!email) { fieldError('#err-login-email', '#login-email', 'Ingresá tu email arriba.'); return; }
    try { await recuperarPassword(email); showAlert('#login-success', 'Te enviamos un correo para recuperar el acceso.', 'success'); }
    catch (err) { showAlert('#login-error', tradError(err), 'error'); }
  });

  // ── Sesión ya iniciada al abrir la página ─────────────────────
  errorDeRedireccion().then(err => { if (err && err.code !== 'auth/popup-closed-by-user') showAlert('#login-error', tradError(err), 'error'); });
  onAuthChange(async (user) => {
    if (!user || enCurso || usuario) return;
    const doc = await obtenerDatosUsuario(user.uid).catch(() => null);
    if (perfilCompleto(doc)) window.location.replace(DESTINO);
    else mostrarExtra(user, doc);
  });
</script>

</body>
</html>
